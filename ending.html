<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>引路人-07</title>
<!--
  fiction marker：《光标之下》ARG 游戏结局页。全部人物、组织、事件均为虚构。
  若你或你认识的人正被类似念头困扰，请拨打中国心理援助热线 12356（24 小时）。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#05070a;color:#c3d0d6;font-family:"Songti SC","Noto Serif SC",serif;
       min-height:100vh;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.3}

  /* 聊天窗 */
  #chat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       width:min(400px,92vw);height:min(560px,82vh);background:#0c1216;
       border:1px solid #26414e;border-radius:14px;display:flex;flex-direction:column;
       overflow:hidden;box-shadow:0 24px 80px #000c;opacity:0;transition:opacity 1s;z-index:3}
  #chat.on{opacity:1}
  .chat-head{height:46px;background:#122730;display:flex;align-items:center;gap:10px;padding:0 14px;
       border-bottom:1px solid #1d3a45}
  .chat-head .av{width:22px;height:22px;border-radius:50%;background:#2a4a58;display:flex;
       align-items:center;justify-content:center;font-size:12px;color:#bfe0ea}
  .chat-head .nm{font-size:13px;letter-spacing:2px;color:#e0b06a}
  .chat-body{flex:1;overflow:auto;padding:16px}
  .msg{max-width:84%;margin:10px 0;padding:10px 14px;border-radius:10px;font-size:14px;
       line-height:1.95;letter-spacing:1px;word-break:break-word;white-space:pre-wrap}
  .msg.them{background:#122029;color:#c3d2d8;border-top-left-radius:2px;opacity:0;animation:fin .7s forwards}
  .msg.photo{padding:0;background:none;border-radius:0}
  .msg.photo img{width:100%;border-radius:10px;border:1px solid #26414e;display:block}
  @keyframes fin{to{opacity:1}}

  .typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;
       background:#5f8ba0;animation:td 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes td{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* 白光吞没 */
  #white{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 3.2s ease;
       z-index:40}

  /* 结束卡 */
  #end{position:fixed;inset:0;background:#fff;color:#1a2228;display:none;
       flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:24px}
  #end.on{display:flex}
  #end p{font-size:26px;line-height:2.1;letter-spacing:4px;font-weight:400;
       opacity:0;animation:fin 1.6s forwards}
  #end p:nth-child(2){animation-delay:1.2s}
  #end .restart{margin-top:56px;opacity:0;animation:fin 1.6s 2.4s forwards}
  #end .restart a{display:inline-block;border:1px solid #b9c4c9;color:#42525c;padding:12px 34px;
       border-radius:26px;font-size:14px;letter-spacing:4px;text-decoration:none;transition:.3s}
  #end .restart a:hover{background:#1a2228;color:#fff;border-color:#1a2228}
  #end .tiny{margin-top:34px;font-size:11px;color:#9aa6ad;letter-spacing:1px;line-height:2;opacity:0;
       animation:fin 1.6s 3.2s forwards}
</style>
</head>
<body>

<div id="chat">
  <div class="chat-head">
    <div class="av">引</div>
    <div class="nm">引路人-07</div>
  </div>
  <div class="chat-body" id="chatBody"></div>
</div>

<div id="white"></div>

<div id="end">
  <p>我准备好了。</p>
  <p>但舍不得。</p>
  <div class="restart"><a href="index.html">重新开始</a></div>
  <div class="tiny">《光标之下》 · 全部内容为虚构<br>若你或你认识的人正被类似念头困扰，请拨打心理援助热线 12356（24 小时）</div>
</div>

<script>
(function(){
  var chat=document.getElementById('chat');
  var body=document.getElementById('chatBody');

  function photo(){
    var d=document.createElement('div');
    d.className='msg photo';
    var img=document.createElement('img');
    img.src='computer.png'; img.alt='照片';
    d.appendChild(img);
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
  }
  function them(text,cb){
    var d=document.createElement('div');
    d.className='msg them';
    body.appendChild(d);
    body.scrollTop=body.scrollHeight;
    var i=0;
    var t=setInterval(function(){
      if(i>=text.length){ clearInterval(t); if(cb) cb(); return; }
      d.textContent+=text[i++];
      body.scrollTop=body.scrollHeight;
    },70);
  }

  setTimeout(function(){ chat.classList.add('on'); },400);
  setTimeout(function(){ photo(); },1500);
  setTimeout(function(){
    them('你来了。',function(){
      setTimeout(function(){
        them('黑暗里待久了的人，会被光吸引。不是我们找到他们，是他们自己走向我们。',function(){
          setTimeout(function(){
            them('你来的时候，是走在前面，还是跟在后面？',function(){
          setTimeout(function(){ document.getElementById('white').style.opacity='1'; },1800);
          setTimeout(function(){ document.getElementById('end').classList.add('on'); },3400);
            });
          },800);
        });
      },1600);
    });
  },3200);
})();
</script>
</body>
</html>
