       background:radial-gradient(60% 42% at 22% 40%,rgba(90,140,170,.5),transparent 60%),

<script>
(function(){
  try{ parent.postMessage({__arg:'nav', file:'doc2.html', disp:'yijia-psy.com/文档2'}, '*'); }catch(e){}

  var COLORS=['rgba(217,122,110,','rgba(232,154,80,','rgba(224,190,90,','rgba(127,208,176,'];

  function buildHeatmap(){
    var map=document.getElementById('map');

    // 若干聚集中心，模拟“高倾向人口带”
    var centers=[];
    for(var k=0;k<9;k++){
      centers.push({
        x:8+Math.random()*84,
        y:8+Math.random()*84,
        r:6+Math.random()*14,
        w:0.12+Math.random()*0.22
      });
    }

    for(var i=0;i<3000;i++){
      var x,y;
      if(Math.random()<0.72){
        var c=centers[Math.floor(Math.random()*centers.length)];
        var ang=Math.random()*Math.PI*2;
        var rad=Math.pow(Math.random(),1.7)*c.r;
        x=c.x+Math.cos(ang)*rad;
        y=c.y+Math.sin(ang)*rad;
      }else{
        x=Math.random()*100;
        y=Math.random()*100;
      }
      x=Math.max(0,Math.min(100,x));
      y=Math.max(0,Math.min(100,y));

      var roll=Math.random();
      var cIdx = roll<0.06 ? 0 : (roll<0.18 ? 1 : (roll<0.5 ? 2 : 3));
      var col=COLORS[cIdx];
      var a=(0.14+Math.random()*0.5).toFixed(2);
      var s=(1.4+Math.random()*2.4).toFixed(1);

      var d=document.createElement('div');
      d.className='hot';
      d.style.left=x+'%';
      d.style.top=y+'%';
      d.style.width=s+'px';
      d.style.height=s+'px';
      d.style.background=col+a+')';
      d.style.boxShadow='0 0 '+(s*2.4)+'px '+col+a+')';
      d.style.animation='heatfade '+(2.2+Math.random()*4.2).toFixed(1)+'s ease-in-out '+(Math.random()*4.5).toFixed(2)+'s infinite';
      map.appendChild(d);
    }

    document.getElementById('clusters').textContent=centers.length;
    var dt=new Date();
    document.getElementById('now').textContent=
      dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+
      String(dt.getDate()).padStart(2,'0')+' '+
      String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
  }

  buildHeatmap();
})();
</script>
